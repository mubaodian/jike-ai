spring:
  application:
    name: jike-aix
  config:
    import: optional:file:.env[.properties]
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/jike_ai
    username: root
    password: 248268
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  # session
  session:
    # session 30 天过期
    timeout: 30d
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        # cookie 30 天过期
        max-age: 2592000
        http-only: true
        same-site: lax
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
      strict-json-schema: true
      response-format: json_object
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.swl.jikeai.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn